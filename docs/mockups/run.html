<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run in progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="base.css">
<style>
.view { display: flex; flex-direction: column; padding: 0; }
.view .scroll { overflow: auto; padding: 12px var(--gutter) 24px; flex: 1; min-height: 0; }
.log { border-top: 1px solid var(--rule); height: 30%; min-height: 120px; overflow: auto; padding: 8px var(--gutter); font-size: var(--s-12); color: var(--muted); flex: none; }
.log[hidden] { display: none; }
.log .warn { color: var(--warn); } .log .error { color: var(--error); }
.frame img.dev { animation: none; }
</style>
</head>
<body>
<script src="directions/data.js"></script>
<script src="shell.js"></script>
<script>
const folders = FOLDERS.map(f => f.name === "Krautrock" ? { ...f, note: "syncing" } : f);
mount({
  head: { folder: "Krautrock", stage: "reading", count: "0/14", spin: true },
  railOpts: { current: "Krautrock", folders },
  main: `<section class="view"><div class="scroll"><div class="bar"><span class="prog" id="prog"></span><span id="pct"></span>
    <span class="mode" role="group" aria-label="View, w"><button data-m="tiles">tiles</button><button data-m="list">list</button></span></div>
    <div id="body"></div></div>
    <div class="log" id="log" hidden>${LOG.map(([c, l]) => `<div class="${c}">${esc(l)}</div>`).join("")}</div></section>`,
  foot: { hints: ['<span id="follow">⟳ following</span>', '<span><span class="k">l</span> <span class="hot">! log</span></span>', ["w", "tiles/list"], ["e", "edit"], ["h", "keys"]] },
});

let mode = "tiles", cursor = 0, follow = true, last = null;
const shown = [], body = document.getElementById("body");
function setMode(m) {
  mode = m; document.querySelectorAll(".mode button").forEach(b => b.setAttribute("aria-pressed", b.dataset.m === m));
  shown.length = 0; body.className = m === "tiles" ? "sheet" : ""; body.innerHTML = TRACKS.map(t => m === "tiles" ? tile(t, "queued") : row(t, "queued")).join("");
  if (last) paint(last);
}
document.querySelectorAll(".mode button").forEach(b => b.onclick = () => setMode(b.dataset.m));
body.onclick = e => { const c = e.target.closest("[data-i]"); if (c) { cursor = +c.dataset.i; stopFollow(); paint(last); } };
function stopFollow() { if (follow) { follow = false; document.getElementById("follow").textContent = "following off"; } }

// A tile repaints only when its status changes; a cover that has just settled steps from coarse to fine.
function paint(state) {
  state.forEach((st, i) => {
    const el = body.children[i]; el.classList.toggle("cur", i === cursor);
    if (shown[i] === st) return;
    const was = shown[i]; shown[i] = st;
    const fresh = mode === "tiles" ? tile(TRACKS[i], st, { cur: i === cursor, size: was && TONE[was] === "live" ? 4 : 16 }) : row(TRACKS[i], st, { cur: i === cursor });
    el.outerHTML = fresh;
    if (mode === "tiles" && was && TONE[was] === "live" && hasArt(st) && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      const img = body.children[i].querySelector("img");
      setTimeout(() => img.src = pixelSleeve(TRACKS[i].album, 8), 170);
      setTimeout(() => img.src = pixelSleeve(TRACKS[i].album, 16), 340);
    }
  });
  document.getElementById("detail").innerHTML = detail(TRACKS[cursor], state[cursor]);
}

addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey) return;
  const cols = mode === "tiles" ? Math.max(1, Math.round(body.clientWidth / (body.children[0].getBoundingClientRect().width + 12))) : 1;
  const move = { j: cols, ArrowDown: cols, k: -cols, ArrowUp: -cols, l: 0, ArrowRight: 1, ArrowLeft: -1, g: -99, G: 99 }[e.key];
  if (e.key === "w") return setMode(mode === "tiles" ? "list" : "tiles");
  if (e.key === "l") { const log = document.getElementById("log"); log.hidden = !log.hidden; return; }
  if (e.key === "f") { follow = true; document.getElementById("follow").textContent = "⟳ following"; return; }
  if (move !== undefined && move !== 0) { e.preventDefault(); cursor = Math.min(TRACKS.length - 1, Math.max(0, cursor + move)); stopFollow(); paint(last); body.children[cursor].scrollIntoView({ block: "nearest" }); }
});

setMode("tiles");
startRun((state, done, total, active) => {
  if (active < 0 && done === 0) shown.length = 0;
  if (active >= 0 && follow) cursor = active;
  last = state.slice(); paint(state);
  document.getElementById("tally").innerHTML = tallyOf(state);
  document.getElementById("count").textContent = `${done}/${total}`;
  document.getElementById("stage").textContent = active < 0 ? (done === total ? "finished" : "reading") : state[active];
  document.getElementById("spin").style.visibility = active < 0 ? "hidden" : "visible";
  const w = 28, fill = Math.round(done / total * w);
  document.getElementById("prog").innerHTML = `[<b>${"█".repeat(fill)}</b>${"░".repeat(w - fill)}]`;
  document.getElementById("pct").textContent = `${done} of ${total} new, 2 on disk, 2 gone`;
  document.title = `earworm · Krautrock · ${active < 0 && done === total ? "finished" : done + "/" + total}`;
  if (follow) body.children[cursor]?.scrollIntoView({ block: "nearest" });
}, { step: 460 });
</script>
</body>
</html>
