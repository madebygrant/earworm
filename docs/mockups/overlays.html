<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlays</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="base.css">
<style>
.gallery { grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr)); }
.dialog { width: 100%; }
.keys { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 3ch; font-size: var(--s-13); }
.keys h4 { font-size: var(--s-12); color: var(--muted); font-weight: 400; margin-bottom: 2px; }
.keys dl { display: grid; grid-template-columns: 9ch 1fr; column-gap: 1ch; }
.keys dt { color: var(--accent); }
.toast { border: 1px solid var(--accent); background: var(--surface); padding: 10px 14px; display: grid; grid-template-columns: auto 1fr; gap: 0 2ch; align-items: center; max-width: 40ch; }
.toast .big { font-size: var(--s-28); color: var(--accent); line-height: 1; }
.toast b { color: var(--accent); }
.console { border-top: 1px solid var(--accent); background: var(--surface); padding: 6px 12px; display: flex; gap: 1ch; }
.backdrop { border: 1px solid var(--rule); background: color-mix(in srgb, var(--far) 50%, transparent); padding: 16px; position: relative; min-height: 120px; display: grid; align-content: end; }
.hit { display: grid; grid-template-columns: 1fr 18ch; gap: 1ch; padding: 1px 6px; white-space: nowrap; }
.hit .t { overflow: hidden; text-overflow: ellipsis; }
.hit .f { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.hit.cur { box-shadow: inset 3px 0 0 var(--cursor); background: color-mix(in srgb, var(--accent) 12%, transparent); }
mark { background: none; color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
<script src="directions/data.js"></script>
<script src="shell.js"></script>
<script>
const keySheet = `<div class="dialog"><span class="t">keys, track list</span><div class="keys">
  <div><h4>move</h4><dl><dt>j k ← →</dt><dd>move</dd><dt>g G</dt><dd>first, last</dd><dt>n N</dt><dd>next unconfirmed</dd><dt>f</dt><dd>follow the run</dd><dt>w</dt><dd>tiles or list</dd></dl></div>
  <div><h4>narrow</h4><dl><dt>/</dt><dd>filter</dd><dt>v</dt><dd>only unconfirmed</dd><dt>space</dt><dd>mark</dd><dt>m M</dt><dd>mark status, artist</dd></dl></div>
  <div><h4>fix</h4><dl><dt>e</dt><dd>edit tags</dd><dt>T</dt><dd>search again</dd><dt>s A</dt><dd>swap, set artist</dd><dt>c</dt><dd>cover art</dd><dt>u</dt><dd>undo</dd></dl></div>
  <div><h4>run</h4><dl><dt>r</dt><dd>retry failed</dd><dt>S</dt><dd>sync this</dd><dt>D</dt><dd>delete departed</dd><dt>p</dt><dd>play in cliamp</dd><dt>l</dt><dd>log</dd></dl></div>
  <div style="grid-column:1/-1"><h4>status words</h4><p><span class="good">ok manual on disk</span>&nbsp; checked &nbsp;&nbsp;<span class="warn">guessed unsure no match</span>&nbsp; worth a look &nbsp;&nbsp;<span class="muted">skipped gone local</span>&nbsp; untouched &nbsp;&nbsp;<span class="error">failed</span></p></div>
  </div><p class="foot"><span><span class="k">esc</span> close</span><span><span class="k">^t</span> theme: graphite</span><span><span class="k">,</span> settings</span></p></div>`;
const quit = `<div class="dialog" style="border-color:var(--warn)"><span class="t" style="color:var(--warn)">quit</span><p>A download is going: 10 of 14 done. Quit and stop it? The tag write under way finishes first.</p>
  <p class="foot"><span><span class="k">y q enter</span> quit</span><span><span class="k">any other key</span> keep going</span><span>so <span class="k">qq</span> quits without reading this</span></p></div>`;
const hits = [["Sowiesoso", "Cluster", "Krautrock"], ["Sowiesoso", "Cluster", "Ambient 1975"], ["Rubato", "Cluster", "Ambient 1975"], ["Hollywood", "Cluster", "Zuckerzeit"], ["Caramel", "Cluster", "Zuckerzeit"]];
const search = `<div class="dialog"><span class="t">search the library</span>
  <div class="form" style="grid-template-columns:2ch 1fr;margin:0 0 10px"><label class="k">t</label><div class="box focus">cluster<span class="caret">&nbsp;</span></div></div>
  ${hits.map(([t, a, f], i) => `<div class="hit ${i === 0 ? "cur" : ""}"><span class="t">${t} <span class="muted">- <mark>${a}</mark></span></span><span class="f">${f}</span></div>`).join("")}
  <p class="foot"><span>14 tracks in 4 folders</span><span><span class="k">enter</span> open its folder</span><span><span class="k">esc</span> close</span></p></div>`;
const toast = `<div class="backdrop"><div class="toast"><span class="big">✦</span><div><b>first crate</b><br><span class="muted">synced your first playlist</span></div></div></div>`;
const consoleBar = `<div class="backdrop" style="padding:0"><div class="console"><span class="k">›</span><span class="caret">&nbsp;</span></div></div>`;
mount({
  head: { folder: "Krautrock", stage: "tagging", count: "10/14", spin: true },
  railOpts: { current: "Krautrock", folders: FOLDERS.map(f => f.name === "Krautrock" ? { ...f, note: "syncing" } : f) },
  main: `<section class="view"><div class="gallery">
    <div class="case"><p class="label">h or ?: the keys for the screen you're on, then what the status words mean.</p>${keySheet}</div>
    <div class="case"><p class="label">q while a download runs. Only a named key confirms.</p>${quit}</div>
    <div class="case"><p class="label">t: every matching track across the library, flat.</p>${search}</div>
    <div class="case"><p class="label">An achievement, top right, gone after a few seconds. Never over a prompt.</p>${toast}</div>
    <div class="case"><p class="label">The console: a line along the bottom on two keys in a row. It names nothing it unlocks.</p>${consoleBar}</div>
  </div></section>`,
  noDetail: true,
  foot: { hints: [["h", "keys"], ["t", "search"], ["q", "quit"]] },
});
</script>
</body>
</html>
