<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick gate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="base.css">
<style>
.go { margin-top: 16px; display: flex; gap: 2ch; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--accent); padding: 3px 14px; }
.btn.primary { background: var(--accent); color: var(--ink); font-weight: 700; }
.twin { color: var(--unsure); }
</style>
</head>
<body>
<script src="directions/data.js"></script>
<script src="shell.js"></script>
<script>
// Everything that needs fetching starts selected, so Enter is the whole playlist and the work is unselecting.
const pick = TRACKS.map(t => ({ t, on: !["on disk", "gone"].includes(t.final) && t.n !== 15, note: t.final === "on disk" ? "on disk" : t.n === 8 ? "≈ in Chill Evenings" : t.n === 15 ? "1:02:11, a live set" : "" }));
pick.length = 16;
const n = () => pick.filter(p => p.on).length;
let cursor = 7;
function draw() {
  document.getElementById("rows").innerHTML = pick.map((p, i) => `<div class="r pick ${i === cursor ? "cur" : ""} ${p.on ? "" : "off"}" data-i="${i}">
    <span class="n">${p.t.n}</span><span class="box ${p.on ? "on" : ""}">[${p.on ? "x" : " "}]</span>
    <span class="t">${esc(p.t.title)} <span class="a">- ${esc(p.t.artist)}</span></span><span class="src ${p.note.startsWith("≈") ? "twin" : ""}">${esc(p.note)}</span></div>`).join("");
  document.getElementById("bandcount").textContent = `${n()} of ${pick.length} selected`;
  document.getElementById("go").textContent = `Download ${n()} tracks`;
  document.getElementById("tally").innerHTML = `<span class="live">${n()} selected</span><span class="muted">2 on disk</span>`;
  const p = pick[cursor];
  document.getElementById("detail").innerHTML = `<div class="none">no sleeve until it's downloaded</div><h2>${esc(p.t.title)} - ${esc(p.t.artist)}</h2>
    <p class="say">${p.note.startsWith("≈") ? "Chill Evenings already has a video that looks like this one. Leave it selected and earworm copies that file across instead of downloading it again." : p.t.n === 15 ? "Over an hour long. Probably not one track." : p.on ? "Selected." : "Not selected."}</p>
    <dl class="kv"><dt>video</dt><dd>${esc(p.t.artist)} - ${esc(p.t.title)} (Official Audio)</dd><dt>channel</dt><dd>${esc(p.t.artist)} - Topic</dd><dt>length</dt><dd>${p.t.n === 15 ? "1:02:11" : "4:" + pad(hash(p.t.title) % 60)}</dd></dl>`;
}
mount({
  head: { folder: "Krautrock", stage: "pick", count: "16 tracks", right: "first sync · music/Krautrock" },
  railOpts: { current: "Krautrock", folders: FOLDERS.map(f => f.name === "Krautrock" ? { ...f, note: "syncing" } : f) },
  main: `<section class="view"><div class="band"><b>pick</b><span id="bandcount"></span><span class="end">space mark · a all · i invert · / filter · enter downloads · esc none</span></div>
    <div id="rows"></div>
    <div class="go"><button class="btn primary" id="go"></button><button class="btn">Take none</button><span class="muted">Esc takes none and still tags what's already in the folder.</span></div></section>`,
  foot: { hints: [["space", "mark"], ["m", "same status"], ["a", "all"], ["i", "invert"], ["enter", "download"], ["esc", "none"]] },
});
document.getElementById("rows").onclick = e => { const r = e.target.closest("[data-i]"); if (r) { cursor = +r.dataset.i; pick[cursor].on = !pick[cursor].on; draw(); } };
addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey) return;
  if (e.key === "j" || e.key === "ArrowDown") cursor = Math.min(pick.length - 1, cursor + 1);
  else if (e.key === "k" || e.key === "ArrowUp") cursor = Math.max(0, cursor - 1);
  else if (e.key === " ") { e.preventDefault(); pick[cursor].on = !pick[cursor].on; }
  else if (e.key === "a") { const all = pick.every(p => p.on); pick.forEach(p => p.on = !all); }
  else if (e.key === "i") pick.forEach(p => p.on = !p.on);
  else return;
  draw();
});
draw();
</script>
</body>
</html>
