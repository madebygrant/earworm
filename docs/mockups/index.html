<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>earworm desktop mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font: 13px/1.5 var(--font); color: var(--text); background: var(--far); display: grid; grid-template-columns: 260px 1fr; }
nav { border-right: 1px solid var(--rule); padding: 16px 0; overflow: auto; }
nav h1 { font-size: 13px; color: var(--accent); padding: 0 16px 12px; font-weight: 400; }
nav h2 { font-size: 12px; color: var(--muted); font-weight: 400; padding: 14px 16px 4px; }
nav button { display: block; width: 100%; text-align: left; font: inherit; color: var(--text); background: none; border: 0; padding: 4px 16px; cursor: pointer; }
nav button span { display: block; color: var(--muted); font-size: 12px; }
nav button[aria-pressed="true"] { background: var(--accent); color: var(--ink); }
nav button[aria-pressed="true"] span { color: var(--ink); }
nav a { display: block; padding: 12px 16px; color: var(--accent); font-size: 12px; }
iframe { width: 100%; height: 100%; border: 0; display: block; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
@media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } nav { border-right: 0; border-bottom: 1px solid var(--rule); max-height: 40vh; } }
</style>
</head>
<body>
<nav>
  <h1>earworm desktop</h1>
  <h2>screens</h2>
  <button data-src="first-launch.html">First launch<span>empty library, the link field, the tools</span></button>
  <button data-src="library.html">Library<span>a folder opened from disk, 3 missing</span></button>
  <button data-src="run.html">A run<span>live: tiles settle, covers sharpen</span></button>
  <button data-src="pick.html">Pick gate<span>choose before downloading</span></button>
  <button data-src="prompts.html">Prompts and forms<span>finish menu, tag forms, link, delete</span></button>
  <button data-src="detail.html">Track detail<span>every status a track can be in</span></button>
  <button data-src="artists.html">Artists<span>an artist's page, locked</span></button>
  <button data-src="settings.html">Settings<span>values and where they came from</span></button>
  <button data-src="overlays.html">Overlays<span>keys, quit, search, achievement, console</span></button>
  <button data-src="custom.html">Custom playlist<span>a list of your own across folders</span></button>
  <button data-src="picker.html">Track picker<span>adding to a list, marks by shape</span></button>
  <button data-src="export.html">Export<span>the four questions, copies only</span></button>
  <button data-src="covers.html">Cover chooser<span>pictures, not labels</span></button>
  <h2>how it got here</h2>
  <button data-src="directions/index.html">Directions A to G<span>the alternatives compared</span></button>
  <button data-src="directions/type-specimens.html">Type pairings<span>the seven tried</span></button>
  <a href="../plans/2026-10-28-desktop-ux-plan.md">The UX plan</a>
</nav>
<iframe id="frame" title="Mockup"></iframe>
<script>
const frame = document.getElementById("frame"), bs = document.querySelectorAll("nav button");
function show(b) { bs.forEach(x => x.setAttribute("aria-pressed", x === b)); frame.src = b.dataset.src; try { localStorage.setItem("screen", b.dataset.src); } catch {} }
bs.forEach(b => b.onclick = () => show(b));
let last; try { last = localStorage.getItem("screen"); } catch {}
show([...bs].find(b => b.dataset.src === last) || bs[2]);
</script>
</body>
</html>
