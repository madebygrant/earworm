<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompts and forms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="base.css">
<style>.dialog { width: 100%; } .gallery { grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); } .case { padding-top: 10px; }</style>
</head>
<body>
<script src="directions/data.js"></script>
<script src="shell.js"></script>
<script>
const cases = [
  ["When a run finishes. Review comes first only when the run left guesses or failures behind.", `
  <div class="dialog"><span class="t">finished</span><p>14 tracks in music/Krautrock, playlist Krautrock.m3u8</p>
  <ul class="menu"><li class="cur"><span class="num">1</span><span>review 4 tracks worth a look</span></li><li><span class="num">2</span><span>keep this open</span></li>
  <li><span class="num">3</span><span>sync another playlist</span></li><li><span class="num">4</span><span>quit</span></li></ul>
  <p class="foot"><span><span class="k">1-4</span> answer</span><span><span class="k">enter</span> choose</span><span><span class="k">esc</span> keeps this open</span></p></div>`],
  ["The run asks when nothing confirmed a track: artist and title only, since the album is what the lookup finds.", `
  <div class="dialog"><span class="t">track 7</span><p class="muted">was&nbsp; Ash Ra Tempel - Traummaschine (1973) [full album side]</p>
  <div class="form"><label>artist</label><div class="box focus">Ash Ra Tempel<span class="caret">&nbsp;</span></div><label>title</label><div class="box">Traummaschine</div></div>
  <p class="foot"><span><span class="k">tab</span> field</span><span><span class="k">^s</span> swap</span><span><span class="k">enter</span> save</span><span><span class="k">esc</span> keeps the guess</span></p></div>`],
  ["e on any track: every field at once, with the video title the tags came from above them.", `
  <div class="dialog"><span class="t">track 9</span><p class="muted">was&nbsp; Popol Vuh - Aguirre I (L'Acrime di Rei)</p>
  <div class="form"><label>artist</label><div class="box">Popol Vuh</div><label>title</label><div class="box focus">Aguirre I<span class="caret">&nbsp;</span></div>
  <label>album</label><div class="box">Aguirre</div><label>year</label><div class="box">1975</div></div>
  <p class="foot"><span><span class="k">tab</span> field</span><span><span class="k">^s</span> swap artist and title</span><span><span class="k">enter</span> save</span><span><span class="k">esc</span> skip</span></p></div>`],
  ["S on a folder earworm didn't download: it asks for the link, then works out which files it already has.", `
  <div class="dialog"><span class="t">sync Rips from CDs</span><p>This folder has no playlist link yet. Paste one and earworm matches the 112 files already here before it fetches anything.</p>
  <div class="form" style="grid-template-columns:5ch 1fr"><label>link</label><div class="box focus">https://youtube.com/playlist?list=PLq<span class="caret">&nbsp;</span></div></div>
  <p class="foot"><span><span class="k">enter</span> sync</span><span><span class="k">esc</span> cancel</span><span>a markdown file of links works too</span></p></div>`],
  ["A link that isn't YouTube comes back for editing with the reason, never thrown away.", `
  <div class="dialog"><span class="t">sync a new link</span>
  <div class="form" style="grid-template-columns:5ch 1fr"><label>link</label><div class="box focus" style="border-color:var(--error)">https://soundcloud.com/sets/kosmische<span class="caret">&nbsp;</span></div></div>
  <p class="error" style="margin-top:8px;font-size:var(--s-12)">Not a YouTube link. earworm takes youtube.com and youtu.be links to a video, playlist or channel.</p>
  <p class="foot"><span><span class="k">enter</span> sync</span><span><span class="k">^u</span> clear</span><span><span class="k">esc</span> cancel</span></p></div>`],
  ["D after a sync: every file is named before anything is deleted.", `
  <div class="dialog" style="border-color:var(--error)"><span class="t" style="color:var(--error)">delete 2 files</span><p>These videos left the playlist. Their files go, and the .m3u8 is rewritten without them.</p>
  <ul class="menu" style="margin-top:8px"><li><span class="num error">-</span><span>17 - Conrad Schnitzler - Auf dem Schwarzen Kanal.opus</span></li><li><span class="num error">-</span><span>18 - Roedelius - Regenmacher.opus</span></li></ul>
  <p class="foot"><span><span class="k">y</span> delete them</span><span><span class="k">any other key</span> keeps them</span></p></div>`],
];
mount({
  head: { folder: "Krautrock", stage: "finished", count: "14/14" },
  railOpts: { current: "Krautrock" },
  main: `<section class="view"><p class="sub">Prompts are dialogs over the screen that asked. Each says what Esc does, in words.</p>
    <div class="gallery">${cases.map(([l, h]) => `<div class="case"><p class="label">${l}</p>${h}</div>`).join("")}</div></section>`,
  noDetail: true,
  foot: { hints: [["1-9", "answer"], ["^t", "theme"], ["h", "keys"]] },
});
</script>
</body>
</html>
