<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artists</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="base.css">
<style>
.rail li { grid-template-columns: 2ch 1fr auto; }
.star { color: var(--accent); }
.rail li[aria-current="true"] .star { color: var(--ink); }
.tabsrow { display: flex; gap: 3ch; border-bottom: 1px solid var(--rule); margin-bottom: 14px; font-size: var(--s-13); }
.tabsrow span { padding: 4px 0; color: var(--muted); }
.tabsrow span[aria-current="true"] { color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); font-weight: 700; }
.frame.missing-rel { border-style: dashed; }
.frame.missing-rel img { opacity: .22; filter: grayscale(1); }
.tracks { list-style: none; padding: 0; font-size: var(--s-13); margin-top: 10px; }
.tracks li { display: grid; grid-template-columns: 2ch 1fr; gap: 1ch; }
.tracks li.no { color: var(--muted); }
</style>
</head>
<body>
<script src="directions/data.js"></script>
<script src="shell.js"></script>
<script>
const ARTISTS = [["Cluster", 14, "★"], ["Michael Rother", 6, "★", "+2 new"], ["Harmonia", 9, "★"], ["Brian Eno", 22], ["Can", 11], ["Fripp & Eno", 5], ["Klaus Schulze", 7], ["Neu!", 8], ["Popol Vuh", 6], ["Tangerine Dream", 12]];
const RELEASES = [["Cluster", 1971, "missing", "○ missing"], ["Cluster II", 1972, "partial", "◐ 2 of 6"], ["Zuckerzeit", 1974, "owned", "● owned"], ["Sowiesoso", 1976, "owned", "● owned"],
  ["Cluster & Eno", 1977, "partial", "◐ 3 of 11"], ["After the Heat", 1978, "missing", "○ missing"], ["Großes Wasser", 1979, "partial", "● 1 here"], ["Curiosum", 1981, "missing", "○ missing"]];
const tone = { owned: "good", partial: "warn", missing: "muted" };
const list = `<ul>${ARTISTS.map(([n, c, s, nw], i) => `<li ${i === 0 ? 'aria-current="true"' : ""}><span class="star">${s || ""}</span><span class="nm">${esc(n)}</span><span class="ct ${nw ? "live" : ""}">${nw || c}</span></li>`).join("")}</ul>`;
const tiles = RELEASES.map(([name, year, k, word], i) => `<div class="tile ${i === 1 ? "cur" : ""}"><div class="frame ${k === "missing" ? "missing-rel" : ""}"><img alt="" src="${pixelSleeve(name, 16)}"></div>
  <div class="cap"><span class="w ${tone[k]}">${word}</span></div><div class="tt">${esc(name)}</div><div class="ar">${year}</div></div>`).join("");
const side = `<img class="cover" src="${pixelSleeve("Cluster II", 16)}" alt=""><h2>Cluster II - Cluster</h2><p class="say">Album, 1972. You have 2 of its 6 tracks, in Ambient 1975 and Rips from CDs.</p>
  <ul class="tracks">${[["Plas", 1], ["Im Süden", 1], ["Für die Katz'", 0], ["Live in der Fabrik", 0], ["Georgel", 0], ["Nabitte", 0]].map(([t, h]) => `<li class="${h ? "" : "no"}"><span class="${h ? "good" : ""}">${h ? "●" : "○"}</span><span>${t}</span></li>`).join("")}</ul>
  <div class="acts"><button><span class="kc">o</span>folders holding it</button></div>`;
mount({
  head: { folder: "Cluster", stage: "artist", count: "14 tracks", right: "Deezer: Cluster · 48,210 followers" },
  railOpts: { tab: "artists", list },
  main: `<section class="view"><div class="bar"><span class="title" style="color:var(--text)">Cluster</span><span>14 tracks in 4 folders · starred</span></div>
    <div class="tabsrow"><span aria-current="true">releases</span><span>top tracks</span><span>related artists</span><span class="muted" style="margin-left:auto"><span class="k">tab</span> next list · <span class="k">a</span> albums and EPs</span></div>
    <div class="sheet">${tiles}</div></section>`,
  side,
  foot: { tally: `<span class="good">2 owned</span><span class="warn">3 partial</span><span class="muted">3 missing</span>`, hints: [["tab", "lists"], ["*", "unstar"], ["o", "their folders"], ["esc", "artists"], ["h", "keys"]] },
});
</script>
</body>
</html>
