<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track detail states</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="base.css">
<style>
.gallery { grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.pane { border: 1px solid var(--rule); background: color-mix(in srgb, var(--surface) 35%, transparent); padding: 10px 14px; font-size: var(--s-14); }
.pane .cover, .pane .none { max-width: 180px; }
.pane.detail { display: block !important; overflow: visible; }
</style>
</head>
<body>
<script src="directions/data.js"></script>
<script src="shell.js"></script>
<script>
SAY.local = () => "A file of yours that the playlist doesn't have. Nothing touches it, it stays out of the .m3u8, and D never deletes it.";
TONE.local = "muted";
SAY.undone = () => "You took the last edit back. Someone typed these values, so it no longer claims a lookup.";
TONE.undone = "good";
const cases = [
  [3, "ok", "Confirmed: teal, like manual, because both were checked."], [6, "manual", "A prompt you answered."],
  [7, "guessed", "Amber: nothing checked it. The pane offers the fix first."], [9, "unsure", "A match turned up and didn't fit."],
  [13, "failed", "The one red. The log has the rest."], [17, "gone", "Left the playlist. Grey, never deleted without asking."],
  [10, "missing", "The manifest knows it, the folder doesn't."], [2, "local", "Yours. earworm leaves it alone."],
  [12, "undone", "After u: the word says who set the tags."],
];
mount({
  head: { folder: "Krautrock", stage: "opened", count: "18 tracks" },
  railOpts: { current: "Krautrock" },
  main: `<section class="view"><p class="sub">The pane on the right, in every state a track can be in. The word is provenance, the colour is confidence, and the actions are the keys that fix it.</p>
    <div class="gallery">${cases.map(([n, st, l]) => `<div class="case"><p class="label">${l}</p><div class="pane detail">${detail(TRACKS[n - 1], st)}</div></div>`).join("")}</div></section>`,
  noDetail: true,
  foot: { hints: [["e", "edit"], ["T", "search again"], ["r", "retry"], ["u", "undo"], ["h", "keys"]] },
});
</script>
</body>
</html>
