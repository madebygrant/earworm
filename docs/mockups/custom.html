<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Custom playlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="base.css">
<style>
.r.list { grid-template-columns: 3ch 1ch 1fr auto; }
.r.list .miss { color: var(--warn); }
.r.list .src { color: var(--muted); }
</style>
</head>
<body>
<script src="directions/data.js"></script>
<script src="shell.js"></script>
<script>
// A list built here: tracks from several folders in an order of your own. A missing file keeps its row with a !,
// so nothing quietly leaves the list; the folder is muted because it is where Enter goes.
const LIST = [[3, "Krautrock"], [10, "Krautrock"], [5, "Krautrock"], [9, "Ambient 1975"], [12, "Krautrock"], [7, "Krautrock", "missing"], [14, "Chill Evenings"], [4, "Krautrock"], [16, "Ambient 1975"]];
const at = 3;
const rows = LIST.map(([n, folder, gone], i) => { const t = TRACKS[n - 1]; return `<div class="r list ${i === at ? "cur" : ""}"><span class="n">${i + 1}</span>
  <span class="miss">${gone ? "!" : ""}</span><span class="t">${esc(t.title)} <span class="a">- ${esc(t.artist)}</span></span><span class="src">${esc(folder)}</span></div>`; }).join("");
const t = TRACKS[LIST[at][0] - 1];
mount({
  head: { folder: "Late Night", stage: "custom playlist", count: "9 tracks", right: "~/Music/.playlists/Late Night.m3u8" },
  railOpts: { current: "Late Night", folders: [...FOLDERS.slice(0, 5), { name: "Late Night", kind: "custom", count: 9 }, ...FOLDERS.slice(5)] },
  main: `<section class="view"><div class="bar"><span class="title" style="color:var(--text)">Late Night</span><span>9 tracks from 3 folders, 1 missing</span></div>${rows}</section>`,
  side: `<img class="cover" src="${pixelSleeve(t.album, 16)}" alt=""><h2>${esc(t.title)} - ${esc(t.artist)}</h2>
    <p class="say">From Ambient 1975. A list holds the track, not the file, so its tags are edited there: Enter goes to it.</p>
    <dl class="kv"><dt>artist</dt><dd>${esc(t.artist)}</dd><dt>title</dt><dd>${esc(t.title)}</dd><dt>album</dt><dd>${esc(t.album)}</dd><dt>folder</dt><dd>Ambient 1975</dd></dl>
    <div class="acts"><button><span class="kc">enter</span>go to Ambient 1975</button><button><span class="kc">J K</span>move</button><button><span class="kc">x</span>remove</button></div>`,
  foot: { tally: `<span class="muted">9 tracks</span><span class="warn">1 missing</span>`, hints: [["enter", "go to source"], ["P", "add tracks"], ["J K", "move"], ["x", "remove"], ["p", "play"], ["esc", "library"]] },
});
</script>
</body>
</html>
