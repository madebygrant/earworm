<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>earworm desktop directions</title>
<style>
:root { color-scheme: light dark; --bg: #E9ECEE; --fg: #15181C; --muted: #5C636B; --rule: #C9CFD4; --on: #15181C; --on-fg: #fff; }
@media (prefers-color-scheme: dark) { :root { --bg: #0E1012; --fg: #ECEFF2; --muted: #9AA3AC; --rule: #2C3238; --on: #ECEFF2; --on-fg: #0E1012; } }
* { box-sizing: border-box; margin: 0; }
body { font: 14px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--fg); height: 100vh; display: grid; grid-template-rows: auto 1fr; }
nav { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)) auto; gap: 8px; padding: 12px 16px; align-items: stretch; }
@media (max-width: 1100px) { nav { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
nav button { font: inherit; color: inherit; text-align: left; background: none; border: 1px solid var(--rule); border-radius: 6px; padding: 8px 12px; cursor: pointer;  }
nav button b { display: block; }
nav button span { color: var(--muted); font-size: 12px; }
nav button[aria-pressed="true"] { background: var(--on); color: var(--on-fg); border-color: var(--on); }
nav button[aria-pressed="true"] span { color: inherit; opacity: .75; }
nav a { margin-left: auto; align-self: center; color: var(--muted); font-size: 12px; }
iframe { width: 100%; height: 100%; border: 0; border-top: 1px solid var(--rule); background: #000; }
:focus-visible { outline: 2px solid #2B4FD8; outline-offset: 2px; }
</style>
</head>
<body>
<nav>
  <button data-src="a-after-hours.html"><b>A. After hours</b><span>Green-black and amber, one humanist sans. The run is the hero: status words settle in a column.</span></button>
  <button data-src="b-liner-notes.html"><b>B. Liner notes</b><span>Light and cover-led. A sleeve wall for the library, art arriving in each row as its tags confirm.</span></button>
  <button data-src="c-phosphor.html"><b>C. Phosphor</b><span>The TUI made native: mono type, its four measured themes, ^t walks them.</span></button>
  <button data-src="d-poster.html"><b>D. Poster</b><span>The ground takes the open folder's cover colour. A giant condensed title fills in as the run goes.</span></button>
  <button data-src="e-sorting-desk.html"><b>E. Sorting desk</b><span>Lanes by what to do next. Tracks travel from Waiting to Done, Check these or Failed.</span></button>
  <button data-src="f-contact-sheet.html"><b>F. Contact sheet</b><span>Every track a tile. Each sleeve develops like a print as its tags confirm.</span></button>
  <button data-src="g-phosphor-sheet.html"><b>G. Phosphor sheet</b><span>C's style with F's tiles. Covers sharpen from coarse pixels to fine as tags confirm.</span></button>
  <button data-src="type-specimens.html"><b>Type pairings</b><span>G in graphite, seven font pairings side by side on the same content.</span></button>
  <a id="open" href="a-after-hours.html" target="_blank">Open on its own</a>
</nav>
<iframe id="frame" title="Mockup"></iframe>
<script>
const frame = document.getElementById("frame"), open = document.getElementById("open");
const bs = document.querySelectorAll("nav button");
function show(b) { bs.forEach(x => x.setAttribute("aria-pressed", x === b)); frame.src = b.dataset.src; open.href = b.dataset.src; try { localStorage.dir = b.dataset.src; } catch {} }
bs.forEach(b => b.onclick = () => show(b));
let last; try { last = localStorage.dir; } catch {}
show([...bs].find(b => b.dataset.src === "type-specimens.html"));
</script>
</body>
</html>
