<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G · Phosphor sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&family=Geist:wght@400;600&family=Geist+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;700&family=Atkinson+Hyperlegible+Mono:wght@400;700&family=Recursive:slnt,wght,CASL,CRSV,MONO@-15..0,300..800,0..1,0..1,0..1&family=Schibsted+Grotesk:wght@400;600&family=Fragment+Mono&family=Martian+Mono:wdth,wght@75..112.5,400..700&display=swap" rel="stylesheet">
<script src="type.js"></script>
<style>
:root, [data-theme="graphite"] { color-scheme: dark; --text:#F1F2F4; --accent:#9DB7FF; --cursor:#7CDDB2; --warn:#F5B867; --error:#FF8F87; --muted:#A0A6B2; --rule:#343842; --surface:#262A31; --unsure:#B9BEC8; --ink:#16181D; --near:rgb(29 32 38); --far:rgb(18 20 24); }
[data-theme="warm"] { color-scheme: dark; --text:#ECDFC0; --accent:#D6B460; --cursor:#60B29E; --warn:#D69A4E; --error:#D67E70; --muted:#9E9480; --rule:#5C5442; --surface:#2E2921; --unsure:#A89B7E; --ink:#181210; --near:rgb(55 40 37); --far:rgb(18 1 22); }
[data-theme="light"] { color-scheme: light; --text:#26221E; --accent:#7C540E; --cursor:#116E62; --warn:#845206; --error:#AA2828; --muted:#696258; --rule:#ACA496; --surface:#FDFBF7; --unsure:#746038; --ink:#FAF8F4; --near:rgb(247 243 236); --far:rgb(231 225 214); }
[data-theme="cool"] { color-scheme: dark; --text:#E2E8F0; --accent:#7EB0DE; --cursor:#5ECEC4; --warn:#DEAA5A; --error:#EC8480; --muted:#96A2B0; --rule:#546272; --surface:#222A34; --unsure:#A0AAB8; --ink:#10141A; --near:rgb(44 52 62); --far:rgb(14 18 24); }
[data-theme="neon"] { color-scheme: dark; --text:#E2E8FF; --accent:#FF5CD5; --cursor:#56F0FF; --warn:#F6E25A; --error:#FF5E78; --muted:#A696CD; --rule:#563078; --surface:#180E26; --unsure:#B4A8D7; --ink:#0A0610; --near:rgb(26 10 44); --far:rgb(8 4 14); }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font: 13px/1.5 var(--data); font-variation-settings: var(--data-axes, normal); color: var(--text);
  background: linear-gradient(160deg, var(--near) 0%, var(--far) 76%, var(--far) 100%);
  display: grid; grid-template-rows: 40px 1fr 30px; overflow: hidden; transition: background .3s; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 0; }

header { display: flex; align-items: center; padding: 0 16px 0 84px; border-bottom: 1px solid var(--rule); white-space: nowrap; position: relative; }
header::before { content: ""; position: absolute; left: 16px; top: 14px; width: 52px; height: 12px;
  background: radial-gradient(circle at 6px 6px, #ED6A5E 5.5px, transparent 6px), radial-gradient(circle at 26px 6px, #F4BF4F 5.5px, transparent 6px), radial-gradient(circle at 46px 6px, #61C554 5.5px, transparent 6px); }
header .sep { color: var(--rule); padding: 0 10px; }
header .brand, header .stage, header .spin { color: var(--accent); }
header .stage { font-weight: 700; }
header .spin { display: inline-block; width: 2ch; }
header .settings { margin-left: auto; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
header .settings b { font-weight: 400; color: var(--text); }

main { display: grid; grid-template-columns: 232px 1fr 340px; min-height: 0; }
.rail { border-right: 1px solid var(--rule); overflow: auto; padding: 8px 0; }
.rail .q { margin: 0 10px 8px; padding: 4px 8px; border: 1px solid var(--rule); color: var(--muted); font-size: 12px; }
.k { color: var(--accent); }
.rail ul { list-style: none; padding: 0; }
.rail li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 3px 10px; }
.rail li .ic { color: var(--muted); text-align: center; }
.rail li .ic.album { color: var(--accent); }
.rail li .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail li .ct { color: var(--muted); font-size: 12px; }
.rail li .ct.miss { color: var(--warn); }
.rail li[aria-current="true"] { background: var(--accent); color: var(--ink); }
.rail li[aria-current="true"] .ic, .rail li[aria-current="true"] .ct { color: var(--ink); }

.view { overflow: auto; min-width: 0; padding: 12px 16px 24px; }
.bar { display: flex; align-items: baseline; gap: 2ch; margin-bottom: 12px; color: var(--muted); font-size: 12px; }
.bar .mode { margin-left: auto; display: flex; border: 1px solid var(--rule); }
.bar .mode button { padding: 1px 10px; color: var(--muted); }
.bar .mode button[aria-pressed="true"] { background: var(--accent); color: var(--ink); }
.prog { font-size: 12px; letter-spacing: -.5px; color: var(--rule); }
.prog b { color: var(--accent); font-weight: 400; }

.sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 16px 12px; }
.tile { min-width: 0; cursor: pointer; }
.frame { aspect-ratio: 1; position: relative; border: 1px solid var(--rule); display: grid; place-items: center; overflow: hidden;
  background: color-mix(in srgb, var(--surface) 70%, transparent); color: var(--muted); font-size: 22px; }
.frame img { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.frame.queued { border-style: dashed; }
.frame.gone img { opacity: .35; filter: grayscale(1); }
.frame.failed { color: var(--error); border-color: var(--error); font-weight: 700; }
.frame.live { border-color: var(--accent); color: var(--accent); }
.frame.live::after { content: ""; position: absolute; left: 0; right: 0; height: 2px; background: var(--accent); opacity: .7; animation: scan 1.2s steps(16) infinite; }
@keyframes scan { from { top: 0; } to { top: 100%; } }
.tile.cur .frame { outline: 2px solid var(--cursor); outline-offset: 2px; }
.cap { margin-top: 6px; display: flex; gap: 1ch; font-size: 12px; white-space: nowrap; }
.cap .n { color: var(--muted); }
.tile .tt, .tile .ar, .rail li .nm, .detail h2, .r .t, .kv dd.nm { font-family: var(--ui); font-variation-settings: var(--ui-axes, normal); }
.tile .tt { font-size: var(--ui-size, 12px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.cur .tt { font-weight: 700; }
.tile .ar { font-size: var(--ui-size, 12px); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.r { display: grid; grid-template-columns: 4ch 10ch 1fr 18ch; gap: 1ch; padding: 2px 12px 2px 8px; position: relative; white-space: nowrap; font-size: 14px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--surface) 55%, transparent), transparent); margin-bottom: 2px; }
.r::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
.r.cur::before { background: var(--cursor); }
.r.cur .t { font-weight: 700; }
.r .n { text-align: right; color: var(--muted); }
.r .t { overflow: hidden; text-overflow: ellipsis; }
.r .t .a, .r .src { color: var(--muted); }
.r .src { overflow: hidden; text-overflow: ellipsis; }

.good { color: var(--cursor); } .warn { color: var(--warn); } .error { color: var(--error); } .muted { color: var(--muted); } .live { color: var(--accent); font-weight: 700; }

.detail { border-left: 1px solid var(--rule); padding: 10px 14px; overflow: auto; font-size: 14px; }
.detail .cover { width: 100%; aspect-ratio: 1; image-rendering: pixelated; margin-bottom: 12px; border: 1px solid var(--rule); display: block; }
.detail .none { width: 100%; aspect-ratio: 1; border: 1px dashed var(--rule); margin-bottom: 12px; display: grid; place-items: center; color: var(--muted); font-size: 12px; }
.detail h2 { font-size: var(--ui-h, 14px); font-weight: 700; margin-bottom: 12px; }
.kv { display: grid; grid-template-columns: 8ch 1fr; column-gap: 1ch; row-gap: 2px; }
.kv dt { color: var(--muted); }
.kv dd { word-break: break-all; }
.acts { margin-top: 14px; display: flex; gap: 12px; flex-wrap: wrap; }
.acts button { color: var(--accent); }
.acts .kc { color: var(--ink); background: var(--accent); padding: 0 .5ch; margin-right: .5ch; }

footer { display: flex; align-items: center; gap: 2ch; padding: 0 16px; border-top: 1px solid var(--rule); font-size: 12px; white-space: nowrap; overflow: hidden; }
#tally { display: flex; gap: 2ch; }
footer .right { margin-left: auto; display: flex; gap: 2ch; color: var(--muted); }
.switch { position: fixed; left: 12px; bottom: 40px; flex-wrap: wrap; max-width: 208px; display: flex; font-size: 12px; border: 1px solid var(--rule); background: var(--surface); }
.switch button { padding: 3px 10px; color: var(--muted); }
.switch.fonts { bottom: 112px; }
.switch button[aria-pressed="true"] { background: var(--accent); color: var(--ink); }

@media (max-width: 1100px) { main { grid-template-columns: 232px 1fr; } .detail { display: none; } }
@media (max-width: 760px) { main { grid-template-columns: 1fr; } .rail, .switch { display: none; } header .settings { display: none; } .r { grid-template-columns: 3ch 9ch 1fr; } .r .src { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header>
  <span class="brand">earworm</span><span class="sep">·</span><span>Krautrock</span><span class="sep">·</span>
  <span class="spin" id="spin">⠋</span><span class="stage" id="stage">reading</span><span class="sep">·</span><span id="count">0/14</span>
  <span class="settings">format <b>opus</b> · lookup <b>on</b> · cover <b>on</b> · m3u8 <b>on</b> · rename <b>on</b></span>
</header>
<main>
  <nav class="rail" aria-label="Library">
    <div class="q"><span class="k">/</span> filter folders</div>
    <ul id="folders"></ul>
  </nav>
  <section class="view">
    <div class="bar"><span class="prog" id="prog"></span><span id="pct"></span>
      <span class="mode" role="group" aria-label="View"><button data-m="tiles">tiles</button><button data-m="list">list</button></span></div>
    <div id="body"></div>
  </section>
  <aside class="detail" id="detail"></aside>
</main>
<footer><span id="tally"></span><span class="right"><span>⟳ following</span><span><span class="k">e</span> edit</span><span><span class="k">,</span> settings</span><span><span class="k">h</span> keys</span></span></footer>
<div class="switch fonts" role="group" aria-label="Type" id="fonts"></div>
<div class="switch" role="group" aria-label="Theme">
  <button data-t="graphite">graphite</button><button data-t="warm">warm</button><button data-t="light">light</button><button data-t="cool">cool</button><button data-t="neon">neon</button>
</div>
<script src="data.js"></script>
<script>
const root = document.documentElement;
const tbs = document.querySelectorAll(".switch:not(.fonts) button");
function setTheme(t) { root.dataset.theme = t; tbs.forEach(b => b.setAttribute("aria-pressed", b.dataset.t === t)); }
tbs.forEach(b => b.onclick = () => setTheme(b.dataset.t));
setTheme("graphite");
const fb = document.getElementById("fonts");
fb.innerHTML = PAIRS.map((p, i) => `<button data-i="${i}" title="${esc(p.name)}">${i + 1}</button>`).join("");
function setFont(i) { applyPair(root, PAIRS[i]); fb.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.i === i)); }
fb.querySelectorAll("button").forEach(b => b.onclick = () => setFont(+b.dataset.i));
setFont(+(new URLSearchParams(location.search).get("type") || 0));
addEventListener("keydown", e => { if (e.ctrlKey && e.key === "t") { e.preventDefault(); const ts = [...tbs].map(b => b.dataset.t); setTheme(ts[(ts.indexOf(root.dataset.theme) + 1) % ts.length]); } });

let mode = "tiles";
const mbs = document.querySelectorAll(".mode button");
function setMode(m) { mode = m; mbs.forEach(b => b.setAttribute("aria-pressed", b.dataset.m === m)); shown.length = 0; build(); if (last) paint(last); }
mbs.forEach(b => b.onclick = () => setMode(b.dataset.m));

const icon = { album: "●", playlist: "▤", local: "◆" };
document.getElementById("folders").innerHTML = FOLDERS.map(f => `
  <li ${f.open ? 'aria-current="true"' : ""}><span class="ic ${f.kind}">${icon[f.kind]}</span><span class="nm">${esc(f.name)}</span>
  <span class="ct ${f.missing ? "miss" : ""}">${f.missing ? f.missing + "!" : f.count}</span></li>`).join("");

const cover = pixelSleeve;
const hasArt = st => !["queued", "fetching", "fetched", "tagging", "failed"].includes(st);

const body = document.getElementById("body");
let cells = [], cursor = 0, pinned = false, last = null;
const shown = [];
function build() {
  body.className = mode === "tiles" ? "sheet" : "";
  body.innerHTML = TRACKS.map(t => mode === "tiles"
    ? `<div class="tile" data-i="${t.n - 1}"><div class="frame"></div><div class="cap"><span class="n">${String(t.n).padStart(2, "0")}</span><span class="w"></span></div><div class="tt">${esc(t.title)}</div><div class="ar">${esc(t.artist)}</div></div>`
    : `<div class="r" data-i="${t.n - 1}"><span class="n">${t.n}</span><span class="w"></span><span class="t">${esc(t.title)} <span class="a">- ${esc(t.artist)}</span></span><span class="src"></span></div>`).join("");
  cells = [...body.children];
}
body.onclick = e => { const c = e.target.closest("[data-i]"); if (c) { cursor = +c.dataset.i; pinned = true; paint(last); } };

function develop(img, name) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { img.src = cover(name, 16); return; }
  img.src = cover(name, 4);
  setTimeout(() => img.src = cover(name, 8), 160);
  setTimeout(() => img.src = cover(name, 16), 340);
}

function paint(state) {
  state.forEach((st, i) => {
    const t = TRACKS[i], tone = TONE[st], c = cells[i];
    c.classList.toggle("cur", i === cursor);
    if (shown[i] === st) return;
    const was = shown[i]; shown[i] = st;
    const w = c.querySelector(".w"); w.className = `w ${tone}`; w.textContent = st;
    if (mode === "list") { c.querySelector(".src").textContent = tone === "live" || st === "queued" ? "" : t.source; return; }
    const f = c.querySelector(".frame");
    f.className = `frame ${tone === "live" ? "live" : ""} ${st === "queued" ? "queued" : ""} ${st === "failed" ? "failed" : ""} ${st === "gone" ? "gone" : ""}`;
    if (hasArt(st)) { f.innerHTML = "<img alt=''>"; const img = f.firstChild; was && TONE[was] === "live" ? develop(img, t.album) : img.src = cover(t.album, 16); }
    else f.textContent = st === "failed" ? "!" : tone === "live" ? "" : String(t.n).padStart(2, "0");
  });
  detail(cursor, state[cursor]);
}

function detail(i, st) {
  const t = TRACKS[i];
  const act = TONE[st] === "warn" ? `<button><span class="kc">T</span>search again</button><button><span class="kc">e</span>edit</button>`
    : st === "failed" ? `<button><span class="kc">r</span>retry failed</button>` : st === "gone" ? `<button><span class="kc">D</span>delete departed</button>` : `<button><span class="kc">e</span>edit</button><button><span class="kc">c</span>cover</button>`;
  document.getElementById("detail").innerHTML = `
    ${hasArt(st) ? `<img class="cover" src="${cover(t.album, 16)}" alt="">` : `<div class="none">no sleeve yet</div>`}
    <h2>${esc(t.title)} - ${esc(t.artist)}</h2>
    <dl class="kv"><dt>status</dt><dd class="${TONE[st]}">${st}</dd><dt>artist</dt><dd class="nm">${esc(t.artist)}</dd><dt>title</dt><dd class="nm">${esc(t.title)}</dd>
    <dt>album</dt><dd class="nm">${esc(t.album)}</dd><dt>year</dt><dd>${t.year}</dd><dt>source</dt><dd>${esc(t.source)}</dd><dt>file</dt><dd>${esc(t.file)}</dd></dl>
    <div class="acts">${act}</div>`;
}

const spin = "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏"; let s = 0;
setInterval(() => { document.getElementById("spin").textContent = spin[s++ % spin.length]; }, 90);
setMode("tiles");
startRun((state, done, total, active) => {
  if (active >= 0 && !pinned) cursor = active;
  if (active < 0 && done === 0) shown.length = 0;
  last = state.slice(); paint(state);
  const tally = {}; state.forEach(st => tally[st] = (tally[st] || 0) + 1);
  document.getElementById("tally").innerHTML = Object.entries(tally).map(([k, v]) => `<span class="${TONE[k]}">${v} ${k}</span>`).join("");
  document.getElementById("count").textContent = `${done}/${total}`;
  document.getElementById("stage").textContent = active < 0 ? (done === total ? "finished" : "reading") : state[active];
  document.getElementById("spin").style.visibility = active < 0 ? "hidden" : "visible";
  const cells20 = 28, fill = Math.round(done / total * cells20);
  document.getElementById("prog").innerHTML = `[<b>${"█".repeat(fill)}</b>${"░".repeat(cells20 - fill)}]`;
  document.getElementById("pct").textContent = `${done} of ${total} new, 2 on disk, 2 gone`;
  if (!pinned) cells[cursor]?.scrollIntoView({ block: "nearest" });
}, { step: 460 });
</script>
</body>
</html>
