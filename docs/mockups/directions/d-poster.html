<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D · Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root { --h: 150; color-scheme: dark;
  --field: hsl(var(--h) 38% 16%); --deep: hsl(var(--h) 45% 9%); --text: hsl(var(--h) 30% 94%); --muted: hsl(var(--h) 14% 70%);
  --rule: hsl(var(--h) 25% 26%); --hot: hsl(calc(var(--h) + 180) 85% 68%);
  --good: #8EE6BE; --warn: #FFC56B; --error: #FF9A8F; }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font: 400 14px/1.45 "Archivo", system-ui, sans-serif; font-stretch: 100%; font-variant-numeric: tabular-nums; color: var(--text);
  background: radial-gradient(120% 90% at 85% 0%, var(--field), var(--deep) 70%); display: grid; grid-template-columns: 72px 1fr; overflow: hidden; transition: background 1s; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
.lights { position: fixed; left: 16px; top: 16px; width: 12px; height: 52px; background: radial-gradient(circle at 6px 6px, #ED6A5E 5.5px, transparent 6px), radial-gradient(circle at 6px 26px, #F4BF4F 5.5px, transparent 6px), radial-gradient(circle at 6px 46px, #61C554 5.5px, transparent 6px); }
nav { padding: 88px 12px 12px; display: grid; gap: 12px; align-content: start; border-right: 1px solid var(--rule); }
nav .s { width: 48px; height: 48px; border-radius: 2px; position: relative; }
nav .s.mosaic { display: grid; grid-template: 1fr 1fr / 1fr 1fr; overflow: hidden; }
nav .s.local { border: 1px dashed var(--rule); display: grid; place-items: center; color: var(--muted); }
nav .s[aria-current="true"] { outline: 2px solid var(--text); outline-offset: 3px; }
nav .s .dot { position: absolute; right: -4px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 2px var(--deep); }

main { display: grid; grid-template-rows: auto 1fr 32px; min-width: 0; min-height: 0; }
.hero { padding: 28px 40px 18px; display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 24px; border-bottom: 1px solid var(--rule); }
.kind { color: var(--muted); font-stretch: 125%; font-weight: 600; font-size: 13px; letter-spacing: .02em; }
h1 { display: inline-block; font-weight: 900; font-stretch: 62%; font-size: clamp(72px, 13vw, 184px); line-height: .82; letter-spacing: -.01em; margin-top: 6px;
  background: linear-gradient(90deg, var(--text) 0 var(--p, 0%), color-mix(in srgb, var(--text) 18%, transparent) var(--p, 0%) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; transition: --p .3s; }
@property --p { syntax: "<percentage>"; inherits: false; initial-value: 0%; }
.stats { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 24px; text-align: right; }
.stats b { display: block; font-weight: 800; font-stretch: 62%; font-size: 44px; line-height: 1; }
.stats span { color: var(--muted); font-size: 12px; }
.stats .warn b { color: var(--warn); } .stats .error b { color: var(--error); } .stats .good b { color: var(--good); }
.now { grid-column: 1 / -1; display: flex; gap: 14px; align-items: baseline; color: var(--muted); }
.now b { color: var(--hot); font-weight: 700; font-stretch: 125%; }

.body { display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
.list { overflow: auto; padding: 8px 28px 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); column-gap: 28px; align-content: start; }
.row { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: baseline; padding: 7px 12px; border-radius: 2px; }
.row .n { color: var(--muted); text-align: right; font-stretch: 75%; font-weight: 600; }
.row .t b { font-weight: 700; font-stretch: 87%; font-size: 16px; }
.row .t span { color: var(--muted); display: block; font-size: 13px; }
.row .st { font-stretch: 125%; font-size: 12px; font-weight: 600; }
.row.cur { background: color-mix(in srgb, var(--text) 9%, transparent); }
.good { color: var(--good); } .warn { color: var(--warn); } .error { color: var(--error); } .muted { color: var(--muted); } .live { color: var(--hot); }
.row.just { animation: just .7s ease-out; }
@keyframes just { from { background: color-mix(in srgb, var(--good) 22%, transparent); } }

aside { border-left: 1px solid var(--rule); padding: 24px; overflow: auto; }
aside .cover { aspect-ratio: 1; border-radius: 2px; margin-bottom: 18px; }
aside h2 { font-weight: 800; font-stretch: 75%; font-size: 34px; line-height: 1; }
aside .by { font-size: 17px; margin-top: 6px; }
aside .say { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--rule); }
aside .say b { font-stretch: 125%; font-size: 12px; display: block; margin-bottom: 2px; }
aside dl { display: grid; grid-template-columns: 52px 1fr; gap: 4px 10px; margin-top: 14px; font-size: 13px; }
aside dt { color: var(--muted); } aside dd { word-break: break-all; }
aside .acts { display: flex; gap: 8px; margin-top: 18px; }
.btn { height: 34px; padding: 0 14px; border-radius: 2px; border: 1px solid var(--rule); font-weight: 600; }
.btn.primary { background: var(--text); color: var(--deep); border-color: var(--text); }
footer { display: flex; align-items: center; gap: 18px; padding: 0 40px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--muted); }
footer .r { margin-left: auto; display: flex; gap: 16px; }
kbd { font: 600 11px/1 "Archivo", sans-serif; padding: 2px 5px; border: 1px solid var(--rule); border-radius: 2px; color: var(--text); margin-right: 4px; }
.pick { position: fixed; right: 16px; top: 14px; display: flex; gap: 4px; font-size: 12px; }
.pick button { padding: 4px 9px; border: 1px solid var(--rule); border-radius: 2px; color: var(--muted); }
.pick button[aria-pressed="true"] { color: var(--deep); background: var(--text); }
@media (max-width: 1150px) { .body { grid-template-columns: 1fr; } aside { display: none; } }
@media (max-width: 760px) { .stats { display: none; } .hero { padding: 24px 20px 14px; } .list { padding: 8px 8px 24px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<span class="lights" aria-hidden="true"></span>
<div class="pick" role="group" aria-label="Folder colour"></div>
<nav aria-label="Library" id="nav"></nav>
<main>
  <section class="hero">
    <div><p class="kind" id="kind">Playlist, 18 tracks</p><h1 id="title">Krautrock</h1></div>
    <div class="stats" id="stats"></div>
    <p class="now" id="now"></p>
  </section>
  <div class="body"><section class="list" id="rows"></section><aside id="detail"></aside></div>
  <footer><span>⟳ following</span><span class="r"><span><kbd>space</kbd>mark</span><span><kbd>e</kbd>edit</span><span><kbd>l</kbd>log</span><span><kbd>h</kbd>keys</span></span></footer>
</main>
<script src="data.js"></script>
<script>
const root = document.documentElement;
// The ground takes its hue from the open folder's sleeve; these buttons try other folders' hues.
const picks = ["Krautrock", "Zuckerzeit", "Phaedra", "Neu! 75"];
const pickEl = document.querySelector(".pick");
pickEl.innerHTML = picks.map(n => `<button data-n="${esc(n)}">${esc(n)}</button>`).join("");
function tint(n) { root.style.setProperty("--h", hue(n)); pickEl.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.n === n)); }
pickEl.querySelectorAll("button").forEach(b => b.onclick = () => tint(b.dataset.n));
tint("Krautrock");

document.getElementById("nav").innerHTML = FOLDERS.map(f => {
  const cur = f.open ? 'aria-current="true"' : "";
  if (f.kind === "local") return `<div class="s local" ${cur} title="${esc(f.name)}">◆</div>`;
  if (f.kind === "playlist") return `<div class="s mosaic" ${cur} title="${esc(f.name)}">${TRACKS.slice(hash(f.name) % 10, hash(f.name) % 10 + 4).map(t => `<span style="background:${sleeve(t.album)}"></span>`).join("")}${f.missing ? '<i class="dot"></i>' : ""}</div>`;
  return `<div class="s" ${cur} title="${esc(f.name)}" style="background:${sleeve(f.name)}"></div>`;
}).join("");

function detail(i, st) {
  const t = TRACKS[i], tone = TONE[st];
  const say = { ok: `Confirmed by ${t.source}.`, manual: "You chose this match.", "on disk": "Already in the folder.", guessed: "Read off the video title. Nothing confirmed it.",
    unsure: `${t.source} found a match that didn't fit.`, failed: "Video unavailable in your country.", gone: "This video has left the playlist.",
    queued: "Waiting its turn.", fetching: "Downloading.", fetched: "Looking it up.", tagging: "Writing tags and art." }[st];
  const act = tone === "warn" ? `<button class="btn primary">Search again</button><button class="btn">Edit tags</button>` : st === "failed" ? `<button class="btn primary">Retry</button>` : st === "gone" ? `<button class="btn">Delete file</button>` : `<button class="btn">Edit tags</button>`;
  document.getElementById("detail").innerHTML = `<div class="cover" style="background:${sleeve(t.album)}"></div><h2>${esc(t.title)}</h2><p class="by">${esc(t.artist)}</p>
    <p class="say"><b class="${tone}">${st}</b>${say}</p><dl><dt>album</dt><dd>${esc(t.album)}, ${t.year}</dd><dt>file</dt><dd>${esc(t.file)}</dd></dl><div class="acts">${act}</div>`;
}

let cursor = 0; const prev = [];
startRun((state, done, total, active) => {
  if (active >= 0) cursor = active;
  const by = {};
  document.getElementById("rows").innerHTML = state.map((st, i) => {
    const t = TRACKS[i], tone = TONE[st], just = prev[i] && TONE[prev[i]] === "live" && tone !== "live";
    by[tone] = (by[tone] || 0) + 1;
    return `<div class="row ${i === cursor ? "cur" : ""} ${just ? "just" : ""}"><span class="n">${t.n}</span><span class="t"><b>${esc(t.title)}</b><span>${esc(t.artist)}</span></span><span class="st ${tone}">${st}</span></div>`;
  }).join("");
  state.forEach((v, i) => prev[i] = v);
  document.getElementById("title").style.setProperty("--p", `${done / total * 100}%`);
  document.getElementById("stats").innerHTML = [["good", "confirmed"], ["warn", "to check"], ["error", "failed"], ["muted", "waiting or untouched"]]
    .map(([k, w]) => `<div class="${k}"><b>${by[k] || 0}</b><span>${w}</span></div>`).join("");
  document.getElementById("now").innerHTML = active < 0 ? (done === total ? `<b>finished</b> ${total} tracks synced` : "<b>reading</b> the playlist")
    : `<b>${state[active]}</b> ${esc(TRACKS[active].title)} by ${esc(TRACKS[active].artist)}<span style="margin-left:auto">${done} of ${total}</span>`;
  detail(cursor, state[cursor]);
  document.querySelector(".row.cur")?.scrollIntoView({ block: "nearest" });
});
</script>
</body>
</html>
