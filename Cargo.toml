[workspace]
members = ["crates/core", "crates/tui", "crates/gui/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/madebygrant/earworm"
homepage = "https://github.com/madebygrant/earworm"

[workspace.dependencies]
earworm-core = { path = "crates/core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false }
lofty = "0.25"
nucleo-matcher = "0.3.1"
ratatui = "0.30"
ratatui-core = "0.1.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "1.1.5"
unicode-normalization = "0.1"
unicode-segmentation = "1.13.3"
unicode-width = "0.2"
ureq = { version = "3", features = ["json"] }

# Dependencies build without debug info to keep target/ small. earworm itself
# keeps full debug info, so its own backtraces still have line numbers.
[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
