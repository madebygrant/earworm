[package]
name = "earworm"
version = "0.1.0"
edition = "2024"
description = "Terminal UI that turns a YouTube playlist into a folder of tagged audio files, with verified tags, cover art and an .m3u8"
license = "MIT OR Apache-2.0"
repository = "https://github.com/madebygrant/earworm"
homepage = "https://github.com/madebygrant/earworm"
readme = "README.md"
keywords = ["youtube", "music", "tui", "tagging", "yt-dlp"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
lofty = "0.25"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "1.1.5"
unicode-normalization = "0.1"
unicode-width = "0.2"
ureq = { version = "3", features = ["json"] }

[profile.release]
strip = true
